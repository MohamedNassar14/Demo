<section class="py-8">
    <figure class="images flex justify-center pb-12">
        <img src="assets/images/wJ799Et16Lh3ibAtamU6AmZxZ1gu4PaY1GGnkdeX.webp" class="w-4/5 rounded-2xl border border-gray-200" />
    </figure>
    <div class="products px-4 sm:px-8 lg:px-12 xl:px-14">
        <div class="products-body grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-5 lg:gap-7">
            @for(product of trends; track product.id) {
                <app-product [product]="product"></app-product>
            }
        </div>
    </div>
</section>
