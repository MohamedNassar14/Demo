<section class="bg-white rounded-2xl shadow-4xl">
    <div class="border-b border-gray-700">
        <div class="head flex items-center justify-between py-5 px-8">
            <div class="title">
                <p class="text-[19px] font-[505]">All Sub Categories List</p>
            </div>
            <div class="add-product">
                <button class="px-6 py-2 bg-green-600 rounded-xl text-lg text-white font-[450]" routerLink="/dashboard/add-sub-category">Add Main Category</button>
            </div>
        </div>
    </div>
    <div class="grid grid-cols-1">
        <div class="grid grid-cols-12 items-center text-center text-lg font-[460] px-3 py-4 border-b border-gray-200">
            <div class="image col-span-3">
                <p>Image</p>
            </div>
            <div class="name col-span-3">
                <p>Name</p>
            </div>
            <div class="name col-span-3">
                <p>Description</p>
            </div>
            <div class="actions col-span-3">
                 <p>Actions</p>
            </div>
        </div>
        @for(category of allSubCategories; track category.id) {
            <div class="grid grid-cols-12 items-center text-center px-3 py-4 border-b border-gray-200">
                <figure class="image col-span-3 w-[80px] h-[80px] mx-auto rounded-2xl flex justify-center">
                    <img [src]="category.imageUrl" class="w-full h-full rounded-2xl"/>
                </figure>
                <div class="name col-span-3">
                    <p>{{category.name}}</p>
                </div>
                <div class="price col-span-3">
                    <p> {{category.description}}</p>
                </div>
                <div class="actions col-span-3 flex justify-center items-center gap-x-8">
                    <div class="view" >
                        <div class="icon">
