<section class="bg-white rounded-2xl shadow-4xl">
        <div class="border-b border-gray-700">
            <div class="head flex items-center justify-between py-5 px-8">
                <div class="title">
                    <p class="text-[19px] font-[505]">All Products List</p>
                </div>
                <div class="add-product">
                    <button class="px-6 py-2 bg-green-600 rounded-xl text-lg text-white font-[450]" routerLink="/dashboard/add-product">Add Product</button>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1">
            <div class="grid grid-cols-12 items-center text-center text-lg font-[460] px-3 py-4 border-b border-gray-200">
                <div class="image col-span-2">
                    <p>Image</p>
                </div>
                <div class="name col-span-2">
                    <p>Name</p>
                </div>
                <div class="price col-span-2">
                    <p>Price</p>
                </div>
                <div class="stock col-span-2">
                    <p>Stock</p>
                </div>
                <div class="category col-span-2 px-4">
                    <p>Category</p>
                </div>
                <div class="actions col-span-2">
                     <p>Actions</p>
                </div>
            </div>
            @for(product of allProducts; track product.id) {
                <div class="grid grid-cols-12 items-center text-center px-3 py-4 border-b border-gray-200">
                    <figure class="image col-span-2 w-[80px] h-[80px] mx-auto rounded-2xl flex justify-center">
                        <img [src]="product.mainImageUrl" class="w-full h-full rounded-2xl"/>
                    </figure>
                    <div class="name col-span-2">
                        <p>{{product.name}}</p>
                    </div>
                    <div class="price col-span-2">
                        <p>EGP {{product.price}}</p>
                    </div>
                    <div class="stock col-span-2">
                        <p>{{product.stockQuantity}}</p>
                    </div>
                    <div class="category col-span-2 px-4">
                        <p>{{product.subCategoryId}}</p>
                    </div>
                    <div class="actions col-span-2 flex justify-center items-center gap-x-8">
                        <div class="view" [routerLink]="['/dashboard/product-info', product.id]">
                            <div class="icon">
                                <svg width="22px" height="22px" viewBox="0 -4 20 20" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

</section>
