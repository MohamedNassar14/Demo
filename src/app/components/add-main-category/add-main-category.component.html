<section>
    <div class="title pb-6">
       <h2 class="text-xl font-[510] text-gray-600">Add New Main Category</h2>
    </div>
    <div class="product-data">
       <form class="space-y-6" [formGroup]="addNewMainCategory" (ngSubmit)="addMainCategory()">
          <div class="bg-white rounded-2xl shadow-4xl px-6 pb-8">
             <p class="text-xl font-[510] text-gray-700 py-4">Add Main Category Photo</p>
             <div
             class="main-image w-1/2 mx-auto h-44 relative border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center text-gray-600 cursor-pointer overflow-hidden">

             <!-- ✅ input للتحميل -->
             <input type="file" accept="image/*" (change)="onFileSelected($event)"
                class="h-full w-full opacity-0 absolute inset-0 cursor-pointer z-10" />

             <!-- ✅ عرض الصورة بعد التحميل -->
             <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview"
                class="absolute inset-0 w-full h-full object-fill rounded-xl z-0" />

             <!-- ✅ محتوى العرض قبل رفع الصورة -->
             <div *ngIf="!imagePreview" class="flex flex-col items-center justify-center pointer-events-none z-0">
                <div class="icon mb-3">
                   <svg width="30px" height="30px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                         <g>
                            <line x1="12" y1="10" x2="12" y2="19" stroke="#db8c1a" stroke-width="2"
                               stroke-linecap="round" />
                            <path
                               d="M15,18 L12.7071,20.2929 C12.3166,20.6834 11.6834,20.6834 11.2929,20.2929 L9,18"
                               stroke="#db8c1a" stroke-width="2" stroke-linecap="round" />
                            <path
                               d="M8,15 L6,15 C4.34315,15 3,13.6569 3,12 C3,10.3431 4.34315,9 6,9 C6,5.68629 8.68629,3 12,3 C15.3137,3 18,5.68629 18,9 C19.6569,9 21,10.3431 21,12 C21,13.6569 19.6569,15 18,15 L16,15"
                               stroke="#db8c1a" stroke-width="2" stroke-linecap="round" />
                         </g>
                      </g>
                   </svg>
                </div>
                <p class="text-xl font-[540] mb-2 text-gray-900">Click here to browse</p>
                <p class="text-gray-400 text-center px-4">
                   530 x 530 recommended, PNG, JPG and GIF files are allowed
                </p>
             </div>
          </div>
          </div>
 
          <div class="bg-white rounded-2xl shadow-4xl px-6 pb-8">
             <p class="text-xl font-[510] text-gray-700 py-4">Add Main Category Information</p>
             <div class="info grid grid-cols-3 gap-x-8 gap-y-4">
                <div class="name">
                   <input type="text" formControlName="name" placeholder="Product Name"
                      class="w-full px-3 py-2 rounded-lg text-textColor border border-gray-300 placeholder:text-gray-400 focus:border-textColor focus:outline-none" />
                </div>
             </div>
             <textarea formControlName="description" placeholder="Description for product"
                class="w-full px-3 py-2 mt-4 rounded-lg text-textColor border border-gray-300 placeholder:text-gray-400 focus:border-textColor focus:outline-none"></textarea>
          </div>
          <button type="submit" class="px-3 py-2 bg-red-700 text-white rounded-xl"> Add </button>
       </form>
    </div>
 </section>
