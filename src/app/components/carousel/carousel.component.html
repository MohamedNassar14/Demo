<section class="carousel">
    <div class="parent">
        <p-carousel
          [value]="images"
          [numVisible]="1"
          [numScroll]="1"
          [circular]="true"
          [autoplayInterval]="3000"
          [showNavigators]="true"
        >
          <ng-template pTemplate="item" let-image>
            <div class="">
              <img
                [src]="image"
                alt="carousel image"
                class="w-full"
              />
            </div>
          </ng-template>
        </p-carousel>
      </div>
      
</section>
