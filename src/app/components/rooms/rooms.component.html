@if(!spinner) {
    <app-spinner></app-spinner>
}
@if(spinner) {
    <main class="space-y-6">
        <section class="banner bg-no-repeat bg-cover bg-center relative min-h-[65vh]" style="background-image: url('assets/images/rooms-baner.jpg')">
            <div class="overlay flex justify-center items-center absolute inset-0 bg-black/45 text-white text-center">
                <div class="brand text-white">
                    <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold text-white uppercase">
                        Rooms
                    </h1>
                </div>
            </div>
        </section>
        <section class="rooms-categories pb-14">
            <div class="rooms-body px-4 lg:px-6 xl:px-8">
                <h2 class="text-xl sm:text-2xl lg:text-3xl text-center font-bold text-mainColor capitalize py-6 sm:py-7 md:py-9 lg:py-12">Explore More</h2>
                <div class="rooms-content grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                    @for(category of roomsCategories; track category.id) {
                        <app-category [category]="category"></app-category>
                    }
                </div>
            </div>
        </section>
    </main>
}
