<a [routerLink]="['/products', category.name]">
    <div class="category rounded-xl">
        <figure class="rounded-xl">
            <img [src]="category.imgUrl" loading="lazy" [alt]="category.name + ' image'" class="w-full rounded-xl"/>
        </figure>
        <div class="catgory-title text-center py-3">
            <h2 class="text-base sm:text-lg lg:text-xl font-semibold capitalize">{{category.name | cutTitle }}</h2>
        </div>
    </div>
</a>
