  <div class="card relative">
    <!-- PrimeNG Carousel Component -->
    <p-carousel #carousel [value]="images" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="3000" [showNavigators]="true" [showIndicators]="true">
      <ng-template pTemplate="item" let-image>
        <div class="mb-2">
          <img [src]="image" [alt]="image.name" class="w-full h-[630px] object-cover rounded-xl" />
        </div>
      </ng-template>
    </p-carousel>
  </div>
